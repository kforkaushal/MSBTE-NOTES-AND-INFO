<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <circle cx="1100" cy="80" r="260" fill="white" fill-opacity="0.06"/>
  <circle cx="80" cy="560" r="220" fill="white" fill-opacity="0.05"/>
  <rect x="940" y="380" width="200" height="200" rx="30" fill="white" fill-opacity="0.04" transform="rotate(25 1040 480)"/>

  <!-- Card container -->
  <rect x="80" y="60" width="1040" height="510" rx="28" fill="#0f172a" fill-opacity="0.75" stroke="white" stroke-opacity="0.15" stroke-width="2" filter="url(#shadow)"/>

  <!-- Badges -->
  <g transform="translate(130, 110)">
    <rect width="170" height="42" rx="21" fill="#2563eb"/>
    <text x="85" y="27" fill="white" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="700" font-size="16" text-anchor="middle" letter-spacing="1">MSBTE K-SCHEME</text>

    <rect x="185" width="150" height="42" rx="21" fill="#10b981"/>
    <text x="260" y="27" fill="white" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="700" font-size="16" text-anchor="middle" letter-spacing="1">MODEL ANSWER</text>

    <rect x="350" width="150" height="42" rx="21" fill="white" fill-opacity="0.12"/>
    <text x="425" y="27" fill="white" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="700" font-size="16" text-anchor="middle" letter-spacing="1">CODE: 315332</text>
  </g>

  <!-- Title & Abbr -->
  <text x="130" y="240" fill="white" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="900" font-size="52" letter-spacing="-0.5">Software Engineering</text>
  <text x='130' y='305' fill='white' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif' font-weight='900' font-size='52' letter-spacing='-0.5'>and Testing</text>

  <text x="130" y="380" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="600" font-size="24" letter-spacing="0.5">MSBTE Official Board Solved Question Papers &amp; Marking Scheme</text>

  <!-- Bottom Badges -->
  <g transform="translate(130, 460)">
    <rect width="140" height="48" rx="12" fill="#2563eb" fill-opacity="0.25" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="70" y="30" fill="#93c5fd" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="700" font-size="18" text-anchor="middle">SET</text>

    <rect x="155" width="220" height="48" rx="12" fill="white" fill-opacity="0.08"/>
    <text x="265" y="30" fill="white" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="600" font-size="17" text-anchor="middle">Step-Wise Solutions</text>

    <rect x="390" width="230" height="48" rx="12" fill="white" fill-opacity="0.08"/>
    <text x="505" y="30" fill="white" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="600" font-size="17" text-anchor="middle">Official Marking Scheme</text>
  </g>

  <!-- Branding -->
  <text x="1060" y="530" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="700" font-size="20" text-anchor="end">msbtenotes-info.netlify.app</text>
</svg>